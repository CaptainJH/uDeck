name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Pack dist
        run: tar -czf site.tar.gz -C dist .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ALI_SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.ALI_SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy to Aliyun
        run: |
          scp site.tar.gz "${{ secrets.ALI_SERVER_USER }}@${{ secrets.ALI_SERVER_IP }}:/tmp/udeck-site.tar.gz"
          ssh "${{ secrets.ALI_SERVER_USER }}@${{ secrets.ALI_SERVER_IP }}" '
            set -e
            rm -rf /var/www/uDeck.new /var/www/uDeck.old
            mkdir -p /var/www/uDeck.new
            tar -xzf /tmp/udeck-site.tar.gz -C /var/www/uDeck.new
            rm -f /tmp/udeck-site.tar.gz
            if [ -d /var/www/uDeck ]; then mv /var/www/uDeck /var/www/uDeck.old; fi
            mv /var/www/uDeck.new /var/www/uDeck
            rm -rf /var/www/uDeck.old
          '

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
